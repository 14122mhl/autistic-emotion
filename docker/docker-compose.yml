version: '3.8'

services:
  # 后端服务
  emotion-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: always
    environment:
      - FLASK_ENV=prod
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=123456
      - MYSQL_DB=emotion_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
    volumes:
      - ../logs:/app/logs
    depends_on:
      - mysql
      - redis

  # MySQL数据库
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=emotion_db
      - MYSQL_CHARACTER_SET_SERVER=utf8mb4
      - MYSQL_COLLATION_SERVER=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"

  # Redis缓存
  redis:
    image: redis:7.0
    restart: always
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"

  # Nginx反向代理
  nginx:
    image: nginx:1.24
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ../frontend:/usr/share/nginx/html
    depends_on:
      - emotion-api

volumes:
  mysql-data:
  redis-data: