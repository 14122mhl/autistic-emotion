server {
    listen 80;
    server_name localhost;  # 本地虚拟机用localhost

    # 前端静态资源
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 后端API代理
    location /api {
        proxy_pass http://emotion-api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 监控指标（可选）
    location /metrics {
        proxy_pass http://emotion-api:5000/metrics;
    }
}