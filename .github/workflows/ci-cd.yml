name: CI/CD Pipeline

on:
  push:
    branches: [ test ]
  pull_request:
    branches: [ test ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: Lint with flake8
      run: |
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Test with pytest
      run: |
        pip install pytest pytest-cov
        pytest --cov=app tests/ --cov-report=xml
    
    - name: Run status logging
      run: |
        echo "=== CI/CD Run Status ==="
        echo "Current branch: ${{ github.ref }}"
        echo "Commit SHA: ${{ github.sha }}"
        echo "Build status: ${{ job.status }}"
    
    - name: Monitor key metrics
      run: |
        echo "=== Key Metrics Monitoring ==="
        # 模拟模型加载耗时检测
        python -c "import time; start=time.time(); time.sleep(0.5); print(f'Model load time: {time.time()-start:.4f}s')"
        # 模拟接口响应耗时检测
        python -c "import time; start=time.time(); time.sleep(0.2); print(f'API response time: {time.time()-start:.4f}s')"
  
  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/test'
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.5.3
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
    
    - name: Add server to known_hosts
      run: |
        ssh-keyscan -H 192.168.70.129 >> ~/.ssh/known_hosts
    
    - name: Deploy to server
      run: |
        echo "=== Deploying to server 192.168.70.129 ==="
        # 连接服务器并执行部署命令
        ssh ubuntu@192.168.70.129 << 'EOF'
          # 进入项目目录
          cd /home/ubuntu/autistic-easy
          
          # 拉取最新代码
          git pull origin test
          
          # 安装依赖
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          
          # 重启服务（假设使用systemd管理）
          sudo systemctl restart autistic-easy.service
          
          # 检查服务状态
          sudo systemctl status autistic-easy.service
        EOF
    
    - name: Deployment status
      run: |
        echo "=== Deployment completed ==="
        echo "Deployed to server: 192.168.70.129"
        echo "Branch: ${{ github.ref }}"
        echo "Commit: ${{ github.sha }}"
