<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自闭症儿童情绪识别系统 | AI Emotion Care</title>
    <!-- 引入谷歌字体，提升质感 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6a11cb;
            --secondary-color: #2575fc;
            --accent-color: #00d2ff;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #2d3436;
            --text-sub: #636e72;
            --success-color: #00b894;
            --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 15px 35px rgba(37, 117, 252, 0.2);
            --radius-lg: 24px;
            --radius-md: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            padding: 20px;
            overflow-x: hidden;
        }

        /* 背景装饰圆圈 */
        .bg-circle {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.6;
        }
        .circle-1 { width: 300px; height: 300px; background: var(--primary-color); top: -50px; left: -50px; }
        .circle-2 { width: 400px; height: 400px; background: var(--accent-color); bottom: -100px; right: -100px; }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            width: 100%;
            max-width: 500px;
            padding: 40px 30px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-soft);
            text-align: center;
            transition: transform 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-bottom: 30px;
        }

        /* 上传区域优化 */
        .upload-area {
            position: relative;
            border: 2px dashed #cbd5e0;
            border-radius: var(--radius-md);
            padding: 40px 20px;
            background: rgba(248, 250, 252, 0.5);
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 25px;
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: var(--secondary-color);
            background: rgba(37, 117, 252, 0.05);
            transform: translateY(-2px);
        }

        .upload-icon {
            font-size: 3rem;
            color: var(--secondary-color);
            margin-bottom: 15px;
            display: block;
        }

        .upload-text {
            color: var(--text-sub);
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        /* 隐藏原始 input，自定义按钮 */
        #imageInput {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 117, 252, 0.3);
            transition: all 0.3s ease;
            outline: none;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .btn-primary::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, var(--secondary-color), var(--primary-color));
            z-index: -1;
            transition: opacity 0.3s ease;
            opacity: 0;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        .btn-primary:hover::after {
            opacity: 1;
        }

        .btn-primary:active {
            transform: translateY(1px);
        }

        /* 结果展示区域优化 */
        .result-area {
            margin-top: 30px;
            background: #fff;
            border-radius: var(--radius-md);
            padding: 25px;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.03);
            border: 1px solid #edf2f7;
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            text-align: left;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-header {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .result-header::before {
            content: '✨';
            font-size: 1.4rem;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 0.95rem;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-label {
            color: var(--text-sub);
            font-weight: 500;
        }

        .result-value {
            font-weight: 700;
            color: var(--primary-color);
            background: rgba(106, 17, 203, 0.05);
            padding: 4px 10px;
            border-radius: 6px;
        }

        .emotion-tag {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            color: #d63384;
            padding: 6px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 4px 10px rgba(255, 154, 158, 0.3);
        }

        .btn-secondary {
            background: white;
            color: var(--secondary-color);
            border: 2px solid var(--secondary-color);
            padding: 10px 25px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 20px;
        }

        .btn-secondary:hover {
            background: var(--secondary-color);
            color: white;
        }

        /* 消息提示 */
        .msg-area {
            margin-top: 20px;
            min-height: 24px;
            font-size: 0.9rem;
            color: #e17055;
            font-weight: 500;
        }

        /* 响应式适配 */
        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- 背景装饰 -->
    <div class="bg-circle circle-1"></div>
    <div class="bg-circle circle-2"></div>

    <div class="container">
        <h1>情绪识别助手</h1>
        <p class="subtitle">用AI守护星星的孩子，读懂每一个表情</p>

        <!-- 图片上传区域 -->
        <div class="upload-area" id="dropZone">
            <input type="file" id="imageInput" accept="image/*">
            <span class="upload-icon">📷</span>
            <div class="upload-text">点击或拖拽图片到此处上传</div>
            <button class="btn-primary" id="uploadBtn">开始识别</button>
        </div>

        <!-- 结果展示区域 -->
        <div class="result-area" id="resultArea" style="display: none;">
            <div class="result-header">识别分析报告</div>

            <div class="result-item">
                <span class="result-label">当前情绪</span>
                <span class="result-value emotion-tag" id="emotion">开心</span>
            </div>

            <div class="result-item">
                <span class="result-label">置信度</span>
                <span class="result-value" id="confidence">98.5%</span>
            </div>

            <div class="result-item">
                <span class="result-label">请求 ID</span>
                <span class="result-value" style="font-size: 0.8rem; font-family: monospace;" id="requestId">REQ-2026-X9Z2</span>
            </div>

            <div class="result-item">
                <span class="result-label">检测时间</span>
                <span class="result-value" style="font-size: 0.85rem;" id="detectTime">2026-02-25 11:15</span>
            </div>

            <button class="btn-secondary" id="queryBtn">重新查询结果</button>
        </div>

        <!-- 提示信息区域 -->
        <div class="msg-area" id="msgArea"></div>
    </div>

    <script>
        // 全局变量
        let currentRequestId = "";

        // 页面加载完成后绑定事件
        document.addEventListener("DOMContentLoaded", function() {
            const uploadBtn = document.getElementById("uploadBtn");
            const queryBtn = document.getElementById("queryBtn");
            const imageInput = document.getElementById("imageInput");
            const resultArea = document.getElementById("resultArea");
            const msgArea = document.getElementById("msgArea");
            const dropZone = document.getElementById('dropZone');

            // 防止默认拖拽行为
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, preventDefaults, false);
            });

            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }

            // 拖拽高亮效果
            ['dragenter', 'dragover'].forEach(eventName => {
                dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
            });
            ['dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
            });

            // 文件选择后显示文件名
            imageInput.addEventListener('change', function() {
                if (this.files && this.files[0]) {
                    document.querySelector('.upload-text').textContent = `已选择: ${this.files[0].name}`;
                    document.querySelector('.upload-text').style.color = '#2575fc';
                    document.querySelector('.upload-text').style.fontWeight = 'bold';
                    msgArea.textContent = "";
                }
            });

            // 上传并识别按钮点击事件
            uploadBtn.addEventListener("click", function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                const file = imageInput.files[0];
                if (!file) {
                    msgArea.textContent = "请选择要上传的图片";
                    msgArea.style.color = "#e17055";
                    return;
                }

                // 显示加载状态
                msgArea.textContent = "正在上传和识别...";
                msgArea.style.color = "#6a11cb";
                uploadBtn.disabled = true;

                // 构建FormData
                const formData = new FormData();
                formData.append("image", file);

                // 发送请求
                fetch("http://192.168.50.49:5000/api/emotion/detect", {
                    method: "POST",
                    body: formData
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    uploadBtn.disabled = false;
                    
                    if (data.request_id) {
                        // 显示结果
                        resultArea.style.display = "block";
                        document.getElementById("requestId").textContent = data.request_id;
                        document.getElementById("emotion").textContent = data.emotion;
                        document.getElementById("confidence").textContent = data.confidence;
                        document.getElementById("detectTime").textContent = data.detect_time;

                        currentRequestId = data.request_id;
                        msgArea.textContent = "识别成功";
                        msgArea.style.color = "#00b894";
                        
                        // 滚动到底部
                        resultArea.scrollIntoView({ behavior: 'smooth' });
                    } else {
                        msgArea.textContent = data.error || "识别失败";
                        msgArea.style.color = "#e17055";
                    }
                })
                .catch(error => {
                    uploadBtn.disabled = false;
                    msgArea.textContent = "请求失败：" + error.message;
                    msgArea.style.color = "#e17055";
                    console.error("Error:", error);
                });
            });

            // 重新查询结果按钮点击事件
            queryBtn.addEventListener("click", function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                if (!currentRequestId) {
                    msgArea.textContent = "暂无请求ID";
                    msgArea.style.color = "#e17055";
                    return;
                }

                // 显示加载状态
                msgArea.textContent = "正在查询结果...";
                msgArea.style.color = "#6a11cb";
                queryBtn.disabled = true;

                fetch(`http://192.168.50.49:5000/api/emotion/query/${currentRequestId}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    queryBtn.disabled = false;
                    
                    if (data.request_id) {
                        document.getElementById("emotion").textContent = data.emotion;
                        document.getElementById("confidence").textContent = data.confidence;
                        document.getElementById("detectTime").textContent = data.detect_time;
                        msgArea.textContent = "查询成功";
                        msgArea.style.color = "#00b894";
                    } else {
                        msgArea.textContent = data.error || "查询失败";
                        msgArea.style.color = "#e17055";
                    }
                })
                .catch(error => {
                    queryBtn.disabled = false;
                    msgArea.textContent = "查询失败：" + error.message;
                    msgArea.style.color = "#e17055";
                    console.error("Error:", error);
                });
            });
        });
    </script>
</body>
</html>
